<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KaneMart - Employees</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <div class="container">

        <h1>Employee Management</h1>

        <div id="message"></div>

        <h2>Add Employee</h2>

        <div>

            <input
                type="text"
                id="name"
                placeholder="Employee Name">

            <input
                type="text"
                id="mobile"
                placeholder="10-digit Mobile">

            <input
                type="text"
                id="role"
                placeholder="Role">

            <button onclick="addEmployee()">
                Add Employee
            </button>

        </div>

        <br>

        <button onclick="loadEmployees()">
            Refresh Employees
        </button>

        <h2>Employees</h2>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Mobile</th>
                    <th>Role</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="employeeTable">

                <tr>
                    <td colspan="5">
                        Loading...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

    <script src="/js/employees.js"></script>

</body>

</html>
