# ==========================================
# KANEMART APPLICATION CONFIGURATION
# ==========================================

spring.application.name=KaneMart

# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/kanemart
spring.datasource.username=root
spring.datasource.password=Nayak27@.

# ==========================================
# JPA AND HIBERNATE CONFIGURATION
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# THYMELEAF CONFIGURATION
# ==========================================

spring.thymeleaf.cache=false

# ==========================================
# SERVER CONFIGURATION
# ==========================================

server.port=8080

# ==========================================
# ERROR HANDLING
# ==========================================

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

# ==========================================
# APPLICATION DEBUG LOGGING
# ==========================================

logging.level.com.kanemart=DEBUG

# ==========================================
# DATABASE DEBUG LOGGING
# ==========================================

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==========================================
# SPRING WEB ERROR LOGGING
# ==========================================

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet=DEBUG