<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>KaneMart - Products</title>

    <link rel="stylesheet"
          href="/css/products.css">
</head>

<body>

    <div class="container">

        <header class="page-header">

            <div>
                <h1>KaneMart Products</h1>
                <p>Product Management</p>
            </div>

            <a href="/dashboard" class="back-btn">
                Dashboard
            </a>

        </header>


        <!-- Add Product -->

        <section class="product-form">

            <h2>Add Product</h2>

            <form id="productForm">

                <div class="form-grid">

                    <div>
                        <label>Product Name</label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter product name"
                            required>
                    </div>

                    <div>
                        <label>SKU</label>

                        <input
                            type="text"
                            id="sku"
                            placeholder="Enter SKU"
                            required>
                    </div>

                    <div>
                        <label>Price</label>

                        <input
                            type="number"
                            id="price"
                            min="0"
                            step="0.01"
                            placeholder="Enter price"
                            required>
                    </div>

                    <div>
                        <label>Quantity</label>

                        <input
                            type="number"
                            id="quantity"
                            min="0"
                            placeholder="Enter quantity"
                            required>
                    </div>

                    <div>
                        <label>Reorder Level</label>

                        <input
                            type="number"
                            id="reorderLevel"
                            min="0"
                            placeholder="Enter reorder level"
                            required>
                    </div>

                </div>

                <button type="submit">
                    Add Product
                </button>

            </form>

            <p id="message"></p>

        </section>


        <!-- Product List -->

        <section class="product-list">

            <div class="list-header">

                <h2>Products</h2>

                <button
                    type="button"
                    onclick="loadProducts()">
                    Refresh
                </button>

            </div>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>SKU</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Reorder Level</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>

                    </thead>

                    <tbody id="productTableBody">

                    </tbody>

                </table>

            </div>

        </section>

    </div>

    <script src="/js/products.js"></script>

</body>

</html>
