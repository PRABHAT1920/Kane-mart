<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KaneMart - Inventory</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="container">

    <h1>Inventory Management</h1>

    <h2>Add Product to Location</h2>

    <div>

        <select id="product">
            <option value="">Select Product</option>
        </select>

        <select id="location">
            <option value="">Select Location</option>
        </select>

        <input
            type="number"
            id="quantity"
            placeholder="Quantity"
            min="0">

        <input
            type="number"
            id="minimumStock"
            placeholder="Minimum Stock"
            min="0">

        <button onclick="addInventory()">
            Add Inventory
        </button>

    </div>

    <br>

    <button onclick="loadInventory()">
        Refresh Inventory
    </button>

    <button onclick="loadLowStock()">
        Low Stock
    </button>

    <div id="message"></div>

    <h2>Current Inventory</h2>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Product</th>
                <th>SKU</th>
                <th>Location</th>
                <th>Quantity</th>
                <th>Minimum Stock</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="inventoryTable">

            <tr>
                <td colspan="7">
                    Loading...
                </td>
            </tr>

        </tbody>

    </table>

</div>

<script src="/js/inventory.js"></script>

</body>

</html>
