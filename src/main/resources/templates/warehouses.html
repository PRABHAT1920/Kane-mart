<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KaneMart - Warehouses</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="container">

    <h1>Warehouse Management</h1>

    <h2>Add Warehouse</h2>

    <div>

        <input
            type="text"
            id="name"
            placeholder="Warehouse Name">

        <input
            type="text"
            id="code"
            placeholder="Warehouse Code">

        <input
            type="text"
            id="address"
            placeholder="Address">

        <button onclick="addWarehouse()">
            Add Warehouse
        </button>

    </div>

    <br>

    <button onclick="loadWarehouses()">
        Refresh Warehouses
    </button>

    <div id="message"></div>

    <h2>Warehouses</h2>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Code</th>
                <th>Address</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="warehouseTable">

            <tr>
                <td colspan="5">
                    Loading...
                </td>
            </tr>

        </tbody>

    </table>

</div>

<script src="/js/warehouses.js"></script>

</body>

</html>
